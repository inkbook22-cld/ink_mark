<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사진형 카드</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .stage { display: grid; grid-template-rows: 1fr auto; }

  /* 사진이 아직 없을 때도 흰 글자가 읽히도록 브랜드색을 깔아둔다 */
  .photo { position: relative; overflow: hidden; background: var(--brand-primary); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 사진 위 글자 가독성 확보. 사진이 밝아도 하단 문구가 읽히게 한다. */
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.62) 100%);
  }

  .eyebrow {
    position: absolute; left: var(--gutter); top: var(--gutter);
    font-size: 30px; font-weight: 600; letter-spacing: .02em;
    color: #fff; background: var(--brand-accent);
    padding: 12px 24px; border-radius: 999px;
  }

  .headline {
    position: absolute; left: var(--gutter); right: var(--gutter); bottom: 56px;
    font-size: 76px; font-weight: 800; line-height: 1.28; color: #fff;
    -webkit-line-clamp: 3;
    text-shadow: 0 2px 24px rgba(0,0,0,.35);
  }

  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 36px var(--gutter); background: var(--brand-primary); color: #fff;
  }
  .footer .body { font-size: 32px; font-weight: 400; -webkit-line-clamp: 2; flex: 1; padding-right: 32px; }
  /* 로고는 원본 파일을 그대로 얹는다. 생성 모델에 맡기지 않는다. */
  .footer img.logo { height: 56px; width: auto; display: block; flex: none; }

  .pager {
    position: absolute; right: var(--gutter); top: var(--gutter);
    font-size: 28px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.35); padding: 10px 20px; border-radius: 999px;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="photo">
    <img id="photo" alt="">
    <div class="eyebrow ko" id="eyebrow"></div>
    <div class="pager" id="pager"></div>
    <div class="headline ko clamp" id="headline"></div>
  </div>
  <div class="footer">
    <div class="body ko clamp" id="body"></div>
    <img class="logo" id="logo" alt="" hidden>
  </div>
</div>

<script type="module">
/*
 * 카드 데이터 주입 지점.
 * 작업 프로세스가 window.__inkData 를 심어 두고 이 페이지를 연다.
 * 미리보기(React)와 캡처(오프스크린 창)가 같은 파일을 쓰므로 결과가 어긋나지 않는다.
 */
const data = window.__inkData ?? {
  // 개발용 기본값 — 긴 한글 문구 잘림을 눈으로 확인하기 위한 샘플
  eyebrow: '이번 주 신메뉴',
  pager: '3 / 7',
  headline: '매일 아침 여섯 시에 반죽을 시작하는 동네 빵집의 겨울 한정 메뉴',
  body: '재료와 굽는 시간까지 그대로 적어두었습니다. 문의는 프로필 링크로 남겨주세요.',
  photo: '',
  logo: '',
  tokens: {},
};

for (const [k, v] of Object.entries(data.tokens ?? {})) {
  document.documentElement.style.setProperty(`--${k}`, v);
}

const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text ?? ''; };
set('eyebrow', data.eyebrow);
set('pager', data.pager);
set('headline', data.headline);
set('body', data.body);

const photo = document.getElementById('photo');
const logo = document.getElementById('logo');
if (data.photo) photo.src = data.photo;
if (data.logo) { logo.src = data.logo; logo.hidden = false; }

/*
 * 글자 잘림 검사.
 * 렌더 시점에 실제 높이를 재므로 확정적이다. 사후 이미지 분석으로는 이 정확도가 안 나온다.
 * 계획의 검증 시나리오 중 "긴 한글 문구" 항목이 여기서 걸린다.
 */
function findOverflow() {
  const clipped = [];
  for (const el of document.querySelectorAll('.clamp, .ko')) {
    const over = el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
    el.dataset.overflow = String(over);
    if (over) clipped.push({ id: el.id, text: el.textContent.trim().slice(0, 40) });
  }
  return clipped;
}

/*
 * 캡처 준비 신호 — 이 파일에서 유일하게 까다로운 부분.
 * 폰트 로딩과 이미지 디코딩이 끝나기 전에 캡처하면 폰트가 안 먹거나 빈 PNG가 나온다.
 * 캡처 쪽은 반드시 window.__inkReady 를 await 한 뒤 찍는다.
 */
window.__inkReady = (async () => {
  await document.fonts.ready;
  await Promise.all(
    [...document.images]
      .filter((img) => img.src && !img.hidden)
      .map((img) => img.decode().catch(() => {})),
  );
  // 레이아웃이 한 프레임 안정된 뒤에 측정한다
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const overflow = findOverflow();
  return { ok: true, overflow, width: 1080, height: 1350 };
})();
</script>
</body>
</html>
